# yaml-language-server: $schema=none
#
# Note: There is no schema available for Lima 2.2.0.
#     Until there is one (?), see -> https://github.com/lima-vm/lima/blob/master/templates/default.yaml
#
minimumLimaVersion: 2.2.0

# macOS defaults ('vz', 'virtiofs'); for other OS'es, just comment them out.
vmType: "vz"
# Note: 'virtiofs' is "experimental on Linux [host?]" (2.2.0)
mountType: "virtiofs"

# Instead of a template, we use a specific image. This is vital for embedded development (USB/IP client) dependencies
# (linux-tools-generic, vhci-hcd).
#
# According to 'google.ai', it's difficult to add the kernel extensions afterwards.
#
images:
  - location: "https://cloud-images.ubuntu.com/resolute/current/resolute-server-cloudimg-arm64.img"
    arch: "aarch64"

  # NOTE: Intel NOT TESTED
  - location: "https://cloud-images.ubuntu.com/resolute/current/resolute-server-cloudimg-amd64.img"
    arch: "x86_64"

# System Resources
#
cpus: 4
memory: "8GiB"
  # 8GB of RAM needed for Remote Development
disk: "40GiB"
  # 20GB falls short with Remote Development and ESP-IDF Rust projects
  # If you use multiple ESP-IDF versions (e.g. 5.5.5, 6.0), each takes ~6..8 GB (~/.espressif).

# Marked as: "EXPERIMENTAL" (2.2.0)
#
# DISABLED because: We might not actually need it (unlike in, say, web development); there have been some conflict
#   dialogs in Rust Rover IDE (memory vs. disk content). #undecided
#mountInotify: true

user:
  name: "lima"
  home: "/home/{{.User}}"
    # Lima defaults to '/home/{{.User}}.guest', we don't need the host/client disambiguation.

# EDIT THESE AT THE END OF THE FILE, replacing 'mounts: none'
#
#mounts:
#  - location: "/Users/xxx/Git/Some"
#    mountPoint: "/home/lima/Some"
#    writable: true
#    sshfs:
#     - cache: false
#    9p:
#     - cache: none

param:
  # Expects a certain name for the Raspberry Pi. Override this by '--param PROBE_RS_REMOTE=...'.
  PROBE_RS_REMOTE: probe-rs@rpi.local

ssh:
  # Note: Variate the port per-project if you need to use multiple Remote Development sessions, simultaneously.
  localPort: 49925
  # Rust Rover Remote Development needs that the VM is approachable only using the '~/.ssh/config'.
  #?loadDotSSHPubKeys: true
  #   tbd. Does this eliminate the need to edit the '~/.ssh/config'?

portForwards:
  # Silence (some) warnings, when creating the VM
  # Note: Rules read from top down (order matters)
  - guestIP: "0.0.0.0"
    proto: "udp"
    ignore: true
  - guestPort: 323
    proto: "any"
    ignore: true
  # Application ports, plus Lima's own ssh
  - guestPortRange: [1024, 65535]
    proto: "tcp"

#---
# Provisioning scripts
#
# Template variables (Lima docs and a test run):
#   {{.Home}}   /home/lima
#   {{.Name}}   edge-vm
#   {{.Hostname}} lima-edge-vm
#   {{.UID}}    502
#   {{.User}}   lima
#   {{.Param.Key}} <no value>
#
# NOTE:
#   'DEBIAN_FRONTEND=noninteractive' matters (for 'system' provisioning). Keep it.
#
provision:
  - mode: system
    script: |
      #!/bin/bash
      export DEBIAN_FRONTEND=noninteractive
      apt update

  # ESP-IDF + bindgen dependencies
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt install -y curl git pkg-config libssl-dev python3 python3-venv cmake build-essential clang make

      touch {{.Home}}/DEBUG.system.1.done

  # Rust and Cargo (general)
  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail

      #🔵 rustup (Rust, Cargo)
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- \
        --default-toolchain stable -y --profile minimal

      . ~/.cargo/env
      
      install -d ~/.local/share/bash-completion/completions
      rustup completions bash       > ~/.local/share/bash-completion/completions/rustup
      rustup completions bash cargo > ~/.local/share/bash-completion/completions/cargo

      #🔵 A common, VM-internal 'target' (less sharing; better performance)
      #   NOTE: Do not use '/tmp/target' - it's mounted as a memory disk in Ubuntu template and could fill up.
      install -d ~/target

      CONFIG_TOML=~/.cargo/config.toml
      [ ! -f "$CONFIG_TOML" ] || { printf >&2 "${CONFIG_TOML} already exists"; false; }
  
      cat >> $CONFIG_TOML <<EOF1
      [build]
      target-dir = "{{.Home}}/target"
      EOF1

  # Rust and Cargo (ESP32-C6 specific)
  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail

      #🔵 ESP32-C6 target
      rustup target add riscv32imac-unknown-none-elf

      #🔵 CLI tools ('ldproxy' needed for ESP-IDF builds with 'global')
      cargo install --locked ldproxy

  # USB/IP client
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive

      apt install -y linux-tools-common linux-tools-$(uname -r)
      
      modprobe vhci-hcd
      # Ensure the module loads on restarts. Ubuntu 26.04 uses this instead of '/etc/modules'.
      echo "vhci-hcd" > /etc/modules-load.d/usbip.conf
  
      touch {{.Home}}/DEBUG.system.3.done

  # Direct 'probe-rs' (USB/IP)
  #
  # tbd. Make this step optional, so that from the *command line* (or from 'custom.params') can steer its inclusion.
  #
  # Note: Remoting to a macOS USB/IP host (open source) is still in its infancy, and *might not emerge* (Apple policies
  #       favor commercial application bundles in this). If there's indication that a local (same machine) macOS
  #       USB/IP connection would be usable (with high enough baud rates), re-enable this.
  #
  #|- mode: system
  #|  script: |
  #|    #!/bin/bash
  #|    set -eux -o pipefail
  #|
  #|    # Set up 'udev' rules and provide user-level access to the devices. |1|
  #|    #   |1| -> https://probe.rs/docs/getting-started/probe-setup/
  #|    curl https://probe.rs/files/69-probe-rs.rules -O --output-dir /etc/udev/rules.d/
  #|
  #|    # Though we'd only use 'plugdev' in the udev rules (above), '/dev/ttyUSB0' may be in the 'dialout' group. Allow both.
  #|    usermod -a -G plugdev {{.User}}
  #|    usermod -a -G dialout {{.User}}
  #|
  #|    # ensure the rules are used; note 'trigger' is not needed since no devices are attached, at this point.
  #|    udevadm control --reload
  #|#
  #|- mode: user
  #|  script: |
  #|    #!/bin/bash
  #|    set -eux -o pipefail
  #|
  #|    # faster than building from source
  #|    curl --proto '=https' --tlsv1.2 -LsSf https://github.com/probe-rs/probe-rs/releases/latest/download/probe-rs-tools-installer.sh | sh

  # Direct 'espflash' (USB/IP)
  #
  # See comments above (on USB/IP 'probe-rs').
  #|- mode: user
  #|  script: |
  #|    #!/bin/bash
  #|    set -eux -o pipefail
  #|
  #|    cargo +stable install espflash --locked
  #|    espflash completions bash > ~/.espflash-completion.bash
  #|
  #|    cat >> ~/.bashrc <<EOF1
  #|
  #|    # Enable command line completion for espflash.
  #|    if [ -f ~/.espflash-completion.bash ]; then
  #|      source ~/.espflash-completion.bash
  #|    fi
  #|    EOF1

  # Client side support for 'espflash' and 'probe-rs' remoting.
  #
  # TO USE THIS,
  #   - edit the 'param.PROBE_RS_REMOTE' entry above, to point to your device.
  #   - if you already created an 'edge-vm' VM, stop, delete and recreate it.
  #
  #     NOTE: Why recreate? We use the default 'user+setup' mode (not 'user+boot'), meaning this script will only get
  #         run _once_. This helps keep it simpler (no idempotency required), and once you can set custom env.vars,
  #         (in a separate file), this should not be a concern. You can _already_ set the env var from the 'limactl start'
  #         command used for creating the VM (a bit of hack, but...).
  #
  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail

      #🔵 Skip if disabled
      #
      # Note:
      #   - {{.Param.xxx}} gives "<no value>" when empty.
      #   - ${PARAM_xxx} gives ...tbd.
      #
      [ -z ${PARAM_PROBE_RS_REMOTE} ] && { \
        touch {{.Home}}/DEBUG.remoting.disabled
        printf >&2 "probe-rs/espflash remoting disabled"; exit 0; \
      }
      touch {{.Home}}/DEBUG.remoting.enabled

      #🔵 Set in '.bashrc'
      cat >> ~/.bashrc <<EOF1

      export PROBE_RS_REMOTE={{.Param.PROBE_RS_REMOTE}}
      EOF1
      
      #🔵 Set up '~/bin' if not already there
      [ -d ~/bin ] || { \
        install -d ~/bin; \
        echo 'export PATH=$PATH:$HOME/bin' >> ~/.bashrc; \
      }

      #🔵 Prepare for remoting; -> https://github.com/finalyards-org/probe-rs-remote
      #
      curl -fsSL -o ~/bin/probe-rs-remote.sh https://raw.githubusercontent.com/finalyards-org/probe-rs-remote/refs/heads/main/sh/probe-rs-remote.sh
      chmod a+x ~/bin/probe-rs-remote.sh

      curl -fsSL -o ~/bin/espflash-remote.sh https://raw.githubusercontent.com/finalyards-org/probe-rs-remote/refs/heads/main/sh/espflash-remote.sh
      chmod a+x ~/bin/espflash-remote.sh

      # Create an ssh key for later (manual) pairing.
      #
      # After this, one can avoid being asked pw's, by:
      #   <<
      #     ssh-copy-id $PROBE_RS_REMOTE
      #   <<
      ssh-keygen < /dev/zero > /dev/null \
        -t rsa -C "for 'espflash' remote" -q -N ""

      cat >> ~/.ssh/config <<EOF3
      # Block quantum warning on using 'espflash' remotely
      Match host ${PARAM_PROBE_RS_REMOTE#*@}
        WarnWeakCrypto no-pq-kex
      EOF3

  # Let the host resolve e.g. 'rpi.local' for remoted probe-rs / espflash use. It has access to mDNS (we don't).
  #
  # Note: It's nice we can do this without a bridging network adapter. :)
  #
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail

      [ -d /etc/systemd/resolved.conf.d ] || { printf >&2 "No '/etc/systemd/resolved.conf.d'; create one."; false; }
      echo -e "[Resolve]\nDomains=~local" | sudo tee /etc/systemd/resolved.conf.d/probe-rs-local.conf

      # Isn't strictly needed: Makefile would stop the VM for mounts (but that may change)
      systemctl restart systemd-resolved

  # DEBUG. Finish up.
  # Note: Lima VM first runs all 'mode: system' scripts, then all 'mode: user'. Sequentially, in order.
  #
  - mode: system
    script: |
      #!/bin/bash
      touch {{.Home}}/DEBUG.system.all.done

  - mode: user
    script: |
      #!/bin/bash
      touch ~/DEBUG.user.all.done
